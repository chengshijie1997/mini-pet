<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini · 虚拟宠物</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="mini">
    <header class="bar">
      <span class="bar__dot" id="connDot" data-state="offline"></span>
      <span class="bar__title">Mini</span>
      <span class="bar__sub">DeepSeek 时段 · 余额</span>
      <button class="bar__btn" id="refreshBtn" type="button" title="立即刷新余额">刷新</button>
    </header>

    <section class="stage">
      <div class="pet" id="pet" data-mood="idle">
        <svg class="pet__art" viewBox="0 0 120 120" role="img" aria-label="虚拟宠物">
          <defs>
            <radialGradient id="bodyGrad" cx="34%" cy="26%" r="78%">
              <stop offset="0%" stop-color="#8ef0d4"/>
              <stop offset="100%" stop-color="#2a9d84"/>
            </radialGradient>
          </defs>
          <ellipse class="pet__shadow" cx="60" cy="108" rx="30" ry="6"/>
          <g class="pet__body">
            <path class="pet__torso" d="M60 12c23 0 39 15 39 36 0 23-16 38-39 38S21 71 21 48C21 27 37 12 60 12z"/>
            <ellipse class="pet__cheek" cx="37" cy="58" rx="7.5" ry="4.6"/>
            <ellipse class="pet__cheek" cx="83" cy="58" rx="7.5" ry="4.6"/>
            <ellipse class="pet__eye" cx="46" cy="45" rx="6.6" ry="7.8"/>
            <ellipse class="pet__eye" cx="74" cy="45" rx="6.6" ry="7.8"/>
            <circle class="pet__glint" cx="48.4" cy="42" r="2.2"/>
            <circle class="pet__glint" cx="76.4" cy="42" r="2.2"/>
            <path class="pet__mouth" d="M53 62q7 7 14 0"/>
            <path class="pet__brow" d="M41 33q5-3 10-1"/>
            <path class="pet__brow" d="M69 32q5-2 10 1"/>
          </g>
          <g class="pet__prop">
            <rect x="44" y="6" width="34" height="17" rx="6"/>
            <text x="61" y="18.6" text-anchor="middle" id="propText">-50%</text>
          </g>
        </svg>
        <div class="bubble" id="bubble">正在读取 DeepSeek 状态…</div>
      </div>
    </section>

    <section class="card card--period" id="periodCard" data-state="unknown">
      <div class="card__head">
        <span class="badge" id="periodBadge">计算中…</span>
        <span class="muted" id="periodRemain">--:--:--</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="periodBar"></div></div>
      <p class="card__note" id="periodNote">北京时间 00:30 - 08:30 为 DeepSeek 优惠时段</p>
      <div class="card__foot">
        <span id="periodNow">—</span>
        <span id="periodNext">—</span>
      </div>
    </section>

    <section class="card card--balance" id="balanceCard" data-state="unknown">
      <h2 class="card__title">账户余额</h2>
      <div class="amount">
        <span class="amount__num" id="balanceNum">--</span>
        <span class="amount__cur" id="balanceCur">CNY</span>
      </div>
      <ul class="kv">
        <li><span>赠送余额</span><b id="balanceGranted">--</b></li>
        <li><span>充值余额</span><b id="balanceTopped">--</b></li>
        <li><span>可用状态</span><b id="balanceAvail">--</b></li>
      </ul>
      <p class="card__note" id="balanceNote">—</p>
    </section>

    <section class="card">
      <h2 class="card__title">本时段折扣</h2>
      <ul class="kv" id="modelList"></ul>
    </section>

    <footer class="foot" id="foot">未连接本地服务：余额不可用，时段仍按本地时间计算</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
